# Millennium statements: build with the mathlib cache, print the axioms, publish the cache as a Release.
#
# Why this exists: the public Lean statements of the seven Clay problems (lean-dojo/LeanMillenniumPrizeProblems)
# compile in minutes with the mathlib cache and in many hours without it. This workflow runs where the cache
# host is reachable, builds the statements, asks Lean which axioms each registered statement rests on, and
# attaches the compiled cache (split under GitHub's 2 GB asset cap) plus the axiom report to a Release, so any
# machine that can reach GitHub can restore a working build in minutes instead of rebuilding mathlib.
#
# Trigger: by hand (Actions tab -> "Millennium cache" -> Run workflow). No secrets are needed: the built-in
# GITHUB_TOKEN creates the Release. Nothing here reads or writes this repository's own files.
name: Millennium cache

on:
  workflow_dispatch:
    inputs:
      statements_ref:
        description: "lean-dojo/LeanMillenniumPrizeProblems commit or branch"
        required: true
        default: "603053d"
      release_tag:
        description: "Release tag to create (left empty: millennium-cache-<run number>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install elan (Lean version manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Clone the statements at the requested ref
        run: |
          git clone https://github.com/lean-dojo/LeanMillenniumPrizeProblems.git statements
          cd statements
          git checkout "${{ github.event.inputs.statements_ref }}"
          echo "toolchain: $(cat lean-toolchain)"
          git rev-parse HEAD > ../STATEMENTS-COMMIT.txt

      - name: Fetch dependencies and the mathlib cache
        working-directory: statements
        run: |
          lake exe cache get
          du -sh .lake

      - name: Build the statements and their tests
        working-directory: statements
        run: |
          lake build Problems Tests 2>&1 | tee ../BUILD-LOG.txt

      - name: Ask Lean which axioms every registered statement rests on
        working-directory: statements
        run: |
          cat > Axioms.lean <<'EOF'
          import Problems
          -- the registered statements (Problems/Registry.lean); #print axioms lists every axiom a term depends on
          #print axioms Millennium.ClayPVersusNP
          #print axioms Millennium.ClayPVersusNP.Formulations.NegativeBranch
          #print axioms Millennium.ClayRiemannHypothesis
          #print axioms Millennium.clay_prize_riemann_hypothesis
          #print axioms MillenniumNavierStokes.FeffermanA
          #print axioms MillenniumNavierStokes.FeffermanB
          #print axioms MillenniumNavierStokes.FeffermanC
          #print axioms MillenniumNavierStokes.FeffermanD
          #print axioms MillenniumHodge.ClayHodge
          #print axioms MillenniumBirchSwinnertonDyer.ClayBirchSwinnertonDyer
          #print axioms MillenniumBirchSwinnertonDyer.clay_prize_birch_swinnerton_dyer
          #print axioms MillenniumYangMills.ClayYangMills
          #print axioms MillenniumPoincare.ClayPoincareConjecture
          #print axioms MillenniumPoincare.clay_prize_poincare_conjecture
          EOF
          lake env lean Axioms.lean 2>&1 | tee ../AXIOMS.txt

      - name: Pack the compiled cache under the 2 GB asset cap
        run: |
          mkdir -p out
          STAMP=$(date -u +%Y%m%dT%H%MZ)
          tar -C statements -cf - .lake | zstd -T0 -3 -q | split -b 1900m -d -a 2 - "out/mathlib-cache-$STAMP.tar.zst.part-"
          cp STATEMENTS-COMMIT.txt AXIOMS.txt BUILD-LOG.txt out/
          cp statements/lean-toolchain out/lean-toolchain.txt
          ( cd out && sha256sum * > MANIFEST.txt )
          ls -la out
          cat out/MANIFEST.txt

      - name: Publish as a Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # softprops/action-gh-release, major version 2, pinned to its commit
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('millennium-cache-{0}', github.run_number) }}
          name: Millennium statements cache (${{ github.run_number }})
          body: |
            Compiled mathlib + lean-dojo statements cache, built on GitHub's runner from the commit in STATEMENTS-COMMIT.txt.
            AXIOMS.txt is Lean's own `#print axioms` for every registered statement. Restore: download every part,
            `cat *.part-* | zstd -d | tar -C <repo> -xf -`, check MANIFEST.txt first.
          files: out/*
