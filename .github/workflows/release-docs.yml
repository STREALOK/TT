# Publish repository documents as a Release.
#
# Trigger: by hand (Actions tab -> "Release documents" -> Run workflow). Give a tag and the paths to attach,
# space-separated; folders are attached as one zip each. No secrets are needed: the built-in GITHUB_TOKEN creates
# the Release. Nothing here changes the repository's files.
name: Release documents

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example dictionary-2026-10-05)"
        required: true
      title:
        description: "Release title"
        required: true
        default: "TT dictionary"
      paths:
        description: "Files or folders to attach, space-separated (a folder becomes one zip)"
        required: true
        default: "templates/dictionary"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout, major version 4, pinned to its commit

      - name: Gather the attachments
        run: |
          mkdir -p out
          for p in ${{ github.event.inputs.paths }}; do
            if [ -d "$p" ]; then
              name=$(basename "$p")
              (cd "$(dirname "$p")" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" "$name")
            elif [ -f "$p" ]; then
              cp "$p" out/
            else
              echo "not found: $p" && exit 1
            fi
          done
          ( cd out && sha256sum * > MANIFEST.txt )
          ls -la out

      - name: Publish as a Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # softprops/action-gh-release, major version 2, pinned to its commit
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title }}
          body: |
            Attached from commit ${{ github.sha }}. MANIFEST.txt holds the sha256 of every file.
          files: out/*
